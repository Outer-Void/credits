  detail: bluxgpt dist metadata declared no licence field. (blux-ca declares the BLUX Proprietary License since Stage 07,
    blux-ca cacae89.)
  status: resolved
  resolution: '2026-10-25: bluxgpt 2.0.0 (blux-gpt dc34f80) declares license = Apache-2.0 with license-files = [LICENSE],
    matching its LICENSE. blux-ca was resolved in cacae89. Third-party packages listed against this item are tracked in libraries.yaml.'
- id: UNR-016
  title: Python dependencies whose licence is declared only by an ambiguous trove classifier
  affects:
  - '*'
  owner: maintainers
  detail: Classifiers such as 'Apache Software License' or 'BSD License' do not state a version/variant. spdx is
    NOASSERTION until the package's LICENSE file is checked. These are installed at runtime, not bundled.
