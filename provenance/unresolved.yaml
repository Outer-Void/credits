# Outer Void credits catalog. Stable IDs: <kind>:<slug>. Do not renumber or reuse IDs.
# verification: VERIFIED (primary evidence inspected) | INFERRED (strong indirect evidence) |
#               OWNER_REPORTED (stated by Outer Void, not independently checked) | REVIEW_REQUIRED
# Audited 2026-10-24. Not legal advice.
schema_version: 1
unresolved:
