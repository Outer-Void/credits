name: Validate ledger

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - name: Ledger consistency
        run: python tools/validate.py
      - name: Unresolved report is current
        run: python tools/render_unresolved.py --check
      - name: Tests
        run: python -m unittest discover -s tests -v
      # Organization-wide notice checks run with --org-root once repos are checked out side by side
      # (see README). They are prepared here but need cross-repo checkout credentials.
